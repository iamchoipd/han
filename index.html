<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  />

  <title>한글 글자 조합 읽기</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      background: #f4f6fa;
      color: #222;

      font-family:
        "Pretendard",
        "Noto Sans KR",
        "Malgun Gothic",
        sans-serif;
    }

    button,
    input {
      font-family: inherit;
    }

    button {
      cursor: pointer;
      touch-action: manipulation;
    }

    .app {
      width: min(780px, 100%);
      min-height: 100vh;

      margin: 0 auto;
      padding: 16px;
    }

    .title {
      text-align: center;

      margin: 8px 0 18px;

      font-size: clamp(28px, 6vw, 40px);
      font-weight: 900;
    }

    .card {
      background: white;

      border-radius: 22px;

      padding: 20px;
      margin-bottom: 14px;

      box-shadow:
        0 8px 28px
        rgba(0, 0, 0, 0.055);
    }

    /* ======================================================
       기록판
    ====================================================== */

    .score-board {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 10px;
    }

    .score-item {
      background: #f4f6fa;

      border-radius: 16px;

      padding: 12px 6px;

      text-align: center;
    }

    .score-label {
      display: block;

      margin-bottom: 5px;

      color: #666;

      font-size: 13px;
    }

    .score-value {
      font-size: clamp(
        21px,
        5vw,
        28px
      );

      font-weight: 900;
    }

    /* ======================================================
       문제 화면
    ====================================================== */

    .practice-card {
      text-align: center;

      padding-top: 25px;
      padding-bottom: 25px;
    }

    .mode-badge {
      display: inline-block;

      padding: 7px 14px;

      margin-bottom: 8px;

      border-radius: 999px;

      background: #eef3ff;
      color: #315fc7;

      font-size: 14px;
      font-weight: 900;
    }

    .letter {
      display: flex;

      justify-content: center;
      align-items: center;

      min-height: 210px;

      font-size: clamp(
        125px,
        32vw,
        205px
      );

      line-height: 1;

      font-weight: 900;

      user-select: none;
    }

    .composition {
      min-height: 45px;

      font-size: clamp(
        24px,
        6vw,
        34px
      );

      color: #555;

      font-weight: 900;
    }

    .hidden {
      visibility: hidden;
    }

    .sub-buttons {
      display: flex;

      justify-content: center;

      gap: 8px;

      flex-wrap: wrap;

      margin-top: 12px;
    }

    .small-button {
      border: 0;

      border-radius: 12px;

      padding: 10px 15px;

      background: #edf0f5;

      color: #333;

      font-size: 15px;
      font-weight: 800;
    }

    /* ======================================================
       맞음 / 틀림
    ====================================================== */

    .answer-buttons {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 12px;

      margin-top: 20px;
    }

    .answer-button {
      min-height: 84px;

      border: 0;

      border-radius: 20px;

      font-size: clamp(
        24px,
        6vw,
        34px
      );

      font-weight: 900;
    }

    .answer-button:active {
      transform: scale(0.97);
    }

    .answer-button:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .correct-button {
      background: #dff8e7;
      color: #137c39;
    }

    .wrong-button {
      background: #ffe5e5;
      color: #c32d2d;
    }

    /* ======================================================
       설정 영역
    ====================================================== */

    details {
      background: white;

      border-radius: 20px;

      margin-bottom: 12px;

      overflow: hidden;

      box-shadow:
        0 5px 20px
        rgba(0, 0, 0, 0.04);
    }

    summary {
      padding: 17px 18px;

      cursor: pointer;

      font-size: 18px;
      font-weight: 900;

      user-select: none;
    }

    .settings-body {
      padding:
        0 18px 18px;
    }

    .mini-actions {
      display: flex;

      flex-wrap: wrap;

      gap: 7px;

      margin-bottom: 10px;
    }

    .mini-actions button {
      border: 0;

      padding: 9px 12px;

      border-radius: 10px;

      background: #eceff5;

      color: #222;

      font-size: 14px;
      font-weight: 800;
    }

    .mini-actions
    .clear-button {
      background: #ffeaea;
      color: #b52727;
    }

    /* ======================================================
       자모 선택
    ====================================================== */

    .choice-grid {
      display: grid;

      grid-template-columns:
        repeat(5, 1fr);

      gap: 7px;
    }

    .choice-item {
      position: relative;
    }

    .choice-item input {
      position: absolute;

      opacity: 0;

      pointer-events: none;
    }

    .choice-item label {
      display: flex;

      justify-content: center;
      align-items: center;

      min-height: 51px;

      border:
        2px solid #e3e6eb;

      border-radius: 13px;

      background: white;

      font-size: 21px;
      font-weight: 900;

      cursor: pointer;

      user-select: none;
    }

    .choice-item
    input:checked + label {
      border-color: #4c7df3;

      background: #eef3ff;

      color: #315fc7;
    }

    .no-final-item label {
      font-size: 15px;
    }

    /* ======================================================
       현재 선택 정보
    ====================================================== */

    .selection-summary {
      line-height: 1.7;

      font-size: 14px;
    }

    .selection-row {
      margin: 3px 0;
    }

    .selection-label {
      display: inline-block;

      min-width: 55px;

      font-weight: 900;
    }

    .selection-value {
      color: #444;
    }

    /* ======================================================
       시작 / 종료
    ====================================================== */

    .main-buttons {
      display: grid;

      grid-template-columns:
        2fr 1fr;

      gap: 9px;

      margin-top: 12px;
    }

    .start-button {
      min-height: 65px;

      border: 0;

      border-radius: 18px;

      background: #4c7df3;

      color: white;

      font-size: 22px;
      font-weight: 900;
    }

    .finish-button {
      min-height: 65px;

      border: 0;

      border-radius: 18px;

      background: #eceff4;

      color: #333;

      font-size: 18px;
      font-weight: 900;
    }

    .finish-button:disabled {
      opacity: 0.4;
    }

    .review-button {
      width: 100%;

      min-height: 56px;

      margin-top: 9px;

      border: 0;

      border-radius: 16px;

      background: #fff1cf;

      color: #805600;

      font-size: 18px;
      font-weight: 900;
    }

    .review-button:disabled {
      opacity: 0.4;
    }

    /* ======================================================
       오답
    ====================================================== */

    .wrong-title {
      margin-bottom: 10px;

      font-weight: 900;
    }

    .wrong-list {
      display: flex;

      flex-wrap: wrap;

      gap: 8px;
    }

    .wrong-chip {
      padding: 8px 12px;

      border-radius: 12px;

      background: #fff0f0;

      color: #b72a2a;

      font-size: 19px;
      font-weight: 900;
    }

    .empty-text {
      color: #888;

      font-size: 14px;
    }

    /* ======================================================
       결과 팝업
    ====================================================== */

    .modal-backdrop {
      display: none;

      position: fixed;

      inset: 0;

      z-index: 100;

      align-items: center;
      justify-content: center;

      padding: 20px;

      background:
        rgba(0, 0, 0, 0.5);
    }

    .modal-backdrop.show {
      display: flex;
    }

    .modal {
      width: min(
        470px,
        100%
      );

      max-height: 90vh;

      overflow-y: auto;

      padding: 26px;

      border-radius: 24px;

      background: white;

      text-align: center;
    }

    .modal-icon {
      font-size: 56px;
    }

    .modal h2 {
      margin:
        6px 0 13px;

      font-size: 28px;
    }

    .result-grid {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 8px;

      margin: 18px 0;
    }

    .result-box {
      padding: 14px;

      border-radius: 15px;

      background: #f4f6fa;
    }

    .result-label {
      display: block;

      margin-bottom: 4px;

      color: #777;

      font-size: 13px;
    }

    .result-value {
      font-size: 24px;
      font-weight: 900;
    }

    .modal-button {
      width: 100%;

      min-height: 52px;

      margin-top: 8px;

      border: 0;

      border-radius: 15px;

      font-size: 17px;
      font-weight: 900;
    }

    .primary-modal-button {
      background: #4c7df3;
      color: white;
    }

    .secondary-modal-button {
      background: #fff1cf;
      color: #765000;
    }

    .gray-modal-button {
      background: #eceff4;
      color: #333;
    }

    /* ======================================================
       모바일
    ====================================================== */

    @media (
      max-width: 480px
    ) {
      .app {
        padding: 10px;
      }

      .card {
        padding: 15px;
      }

      .letter {
        min-height: 170px;
      }

      .choice-grid {
        grid-template-columns:
          repeat(5, 1fr);

        gap: 5px;
      }

      .choice-item label {
        min-height: 47px;

        font-size: 19px;
      }

      .no-final-item label {
        font-size: 13px;
      }

      .answer-button {
        min-height: 75px;
      }

      .main-buttons {
        grid-template-columns:
          1fr;
      }
    }
  </style>
</head>

<body>

<main class="app">

  <h1 class="title">
    한글 글자 조합 읽기
  </h1>


  <!-- ============================================
       학습 기록
  ============================================= -->

  <section class="card">

    <div class="score-board">

      <div class="score-item">

        <span class="score-label">
          맞음
        </span>

        <strong
          class="score-value"
          id="correctCount"
        >
          0
        </strong>

      </div>


      <div class="score-item">

        <span class="score-label">
          시도
        </span>

        <strong
          class="score-value"
          id="attemptCount"
        >
          0
        </strong>

      </div>


      <div class="score-item">

        <span class="score-label">
          정답률
        </span>

        <strong
          class="score-value"
          id="accuracy"
        >
          0%
        </strong>

      </div>

    </div>

  </section>


  <!-- ============================================
       글자
  ============================================= -->

  <section
    class="card practice-card"
  >

    <div
      class="mode-badge"
      id="modeBadge"
    >
      연습 준비
    </div>


    <div
      class="letter"
      id="letter"
    >
      가
    </div>


    <div
      class="composition"
      id="composition"
    >
      ㄱ + ㅏ
    </div>


    <div class="sub-buttons">

      <button
        class="small-button"
        id="compositionButton"
        type="button"
      >
        조합 숨기기
      </button>


      <button
        class="small-button"
        id="speakButton"
        type="button"
      >
        🔊 소리 듣기
      </button>

    </div>


    <div class="answer-buttons">

      <button
        class="
          answer-button
          correct-button
        "
        id="correctButton"
        type="button"
        disabled
      >
        ✅ 맞음
      </button>


      <button
        class="
          answer-button
          wrong-button
        "
        id="wrongButton"
        type="button"
        disabled
      >
        ❌ 틀림
      </button>

    </div>

  </section>


  <!-- ============================================
       초성
  ============================================= -->

  <details open>

    <summary>
      ㄱ 초성 선택
    </summary>


    <div class="settings-body">

      <div class="mini-actions">

        <button
          id="basicConsonants"
          type="button"
        >
          기본 자음
        </button>


        <button
          id="allConsonants"
          type="button"
        >
          전체 선택
        </button>


        <button
          class="clear-button"
          id="clearConsonants"
          type="button"
        >
          전체 해제
        </button>

      </div>


      <div
        class="choice-grid"
        id="consonantGrid"
      ></div>

    </div>

  </details>


  <!-- ============================================
       모음
  ============================================= -->

  <details open>

    <summary>
      ㅏ 모음 선택
    </summary>


    <div class="settings-body">

      <div class="mini-actions">

        <button
          id="basicVowels"
          type="button"
        >
          기본 모음
        </button>


        <button
          id="allVowels"
          type="button"
        >
          전체 선택
        </button>


        <button
          class="clear-button"
          id="clearVowels"
          type="button"
        >
          전체 해제
        </button>

      </div>


      <div
        class="choice-grid"
        id="vowelGrid"
      ></div>

    </div>

  </details>


  <!-- ============================================
       받침
  ============================================= -->

  <details open>

    <summary>
      ㄴ 받침 선택
    </summary>


    <div class="settings-body">

      <div class="mini-actions">

        <button
          id="noFinalOnly"
          type="button"
        >
          받침 없음
        </button>


        <button
          id="basicFinals"
          type="button"
        >
          기본 받침
        </button>


        <button
          id="simpleFinals"
          type="button"
        >
          홑받침 전체
        </button>


        <button
          id="allFinals"
          type="button"
        >
          전체 받침
        </button>


        <button
          class="clear-button"
          id="clearFinals"
          type="button"
        >
          전체 해제
        </button>

      </div>


      <div
        class="choice-grid"
        id="finalGrid"
      ></div>

    </div>

  </details>


  <!-- ============================================
       선택한 글자 정보
  ============================================= -->

  <section class="card">

    <div
      style="
        font-weight:900;
        margin-bottom:9px;
      "
    >
      🔤 현재 선택
    </div>


    <div
      class="selection-summary"
    >

      <div class="selection-row">

        <span class="selection-label">
          초성
        </span>

        <span
          class="selection-value"
          id="selectedConsonantsText"
        >
        </span>

      </div>


      <div class="selection-row">

        <span class="selection-label">
          모음
        </span>

        <span
          class="selection-value"
          id="selectedVowelsText"
        >
        </span>

      </div>


      <div class="selection-row">

        <span class="selection-label">
          받침
        </span>

        <span
          class="selection-value"
          id="selectedFinalsText"
        >
        </span>

      </div>


      <div class="selection-row">

        <span class="selection-label">
          조합 수
        </span>

        <strong
          id="combinationCount"
        >
          0개
        </strong>

      </div>

    </div>

  </section>


  <!-- ============================================
       시작 / 종료
  ============================================= -->

  <div class="main-buttons">

    <button
      class="start-button"
      id="startButton"
      type="button"
    >
      ▶ 연습 시작
    </button>


    <button
      class="finish-button"
      id="finishButton"
      type="button"
      disabled
    >
      ■ 연습 종료
    </button>

  </div>


  <button
    class="review-button"
    id="reviewButton"
    type="button"
    disabled
  >
    🔁 틀린 글자 다시 연습
  </button>


  <!-- ============================================
       오답
  ============================================= -->

  <section
    class="card"
    style="margin-top:16px;"
  >

    <div class="wrong-title">
      ❌ 틀린 글자
    </div>


    <div
      class="wrong-list"
      id="wrongList"
    >

      <span class="empty-text">
        아직 틀린 글자가 없습니다.
      </span>

    </div>

  </section>

</main>


<!-- ============================================
     결과창
============================================= -->

<div
  class="modal-backdrop"
  id="resultModal"
>

  <div class="modal">

    <div
      class="modal-icon"
      id="modalIcon"
    >
      📊
    </div>


    <h2 id="modalTitle">
      연습 결과
    </h2>


    <p id="modalMessage">
      연습을 마쳤습니다.
    </p>


    <div class="result-grid">

      <div class="result-box">

        <span class="result-label">
          맞은 수
        </span>

        <strong
          class="result-value"
          id="resultCorrect"
        >
          0
        </strong>

      </div>


      <div class="result-box">

        <span class="result-label">
          전체 시도
        </span>

        <strong
          class="result-value"
          id="resultAttempts"
        >
          0
        </strong>

      </div>


      <div class="result-box">

        <span class="result-label">
          틀린 횟수
        </span>

        <strong
          class="result-value"
          id="resultWrong"
        >
          0
        </strong>

      </div>


      <div class="result-box">

        <span class="result-label">
          정답률
        </span>

        <strong
          class="result-value"
          id="resultAccuracy"
        >
          0%
        </strong>

      </div>

    </div>


    <button
      class="
        modal-button
        secondary-modal-button
      "
      id="modalReviewButton"
      type="button"
    >
      🔁 오답 다시 연습
    </button>


    <button
      class="
        modal-button
        primary-modal-button
      "
      id="modalNewButton"
      type="button"
    >
      ▶ 새 연습 시작
    </button>


    <button
      class="
        modal-button
        gray-modal-button
      "
      id="closeModalButton"
      type="button"
    >
      결과 닫기
    </button>

  </div>

</div>


<script>

/* ============================================================
   1. 한글 데이터
============================================================ */


/*
  초성 19개
*/
const consonants = [

  { char: "ㄱ", index: 0 },
  { char: "ㄲ", index: 1 },
  { char: "ㄴ", index: 2 },
  { char: "ㄷ", index: 3 },
  { char: "ㄸ", index: 4 },

  { char: "ㄹ", index: 5 },
  { char: "ㅁ", index: 6 },
  { char: "ㅂ", index: 7 },
  { char: "ㅃ", index: 8 },
  { char: "ㅅ", index: 9 },

  { char: "ㅆ", index: 10 },
  { char: "ㅇ", index: 11 },
  { char: "ㅈ", index: 12 },
  { char: "ㅉ", index: 13 },
  { char: "ㅊ", index: 14 },

  { char: "ㅋ", index: 15 },
  { char: "ㅌ", index: 16 },
  { char: "ㅍ", index: 17 },
  { char: "ㅎ", index: 18 }

];


/*
  모음 21개
*/
const vowels = [

  { char: "ㅏ", index: 0 },
  { char: "ㅐ", index: 1 },
  { char: "ㅑ", index: 2 },
  { char: "ㅒ", index: 3 },

  { char: "ㅓ", index: 4 },
  { char: "ㅔ", index: 5 },
  { char: "ㅕ", index: 6 },
  { char: "ㅖ", index: 7 },

  { char: "ㅗ", index: 8 },
  { char: "ㅘ", index: 9 },
  { char: "ㅙ", index: 10 },
  { char: "ㅚ", index: 11 },

  { char: "ㅛ", index: 12 },

  { char: "ㅜ", index: 13 },
  { char: "ㅝ", index: 14 },
  { char: "ㅞ", index: 15 },
  { char: "ㅟ", index: 16 },

  { char: "ㅠ", index: 17 },

  { char: "ㅡ", index: 18 },
  { char: "ㅢ", index: 19 },

  { char: "ㅣ", index: 20 }

];


/*
  종성

  index 0 = 받침 없음

  실제 받침은
  1 ~ 27
*/
const finals = [

  {
    char: "없음",
    display: "없음",
    index: 0,
    type: "none"
  },

  {
    char: "ㄱ",
    index: 1,
    type: "simple"
  },

  {
    char: "ㄲ",
    index: 2,
    type: "simple"
  },

  {
    char: "ㄳ",
    index: 3,
    type: "double"
  },

  {
    char: "ㄴ",
    index: 4,
    type: "simple"
  },

  {
    char: "ㄵ",
    index: 5,
    type: "double"
  },

  {
    char: "ㄶ",
    index: 6,
    type: "double"
  },

  {
    char: "ㄷ",
    index: 7,
    type: "simple"
  },

  {
    char: "ㄹ",
    index: 8,
    type: "simple"
  },

  {
    char: "ㄺ",
    index: 9,
    type: "double"
  },

  {
    char: "ㄻ",
    index: 10,
    type: "double"
  },

  {
    char: "ㄼ",
    index: 11,
    type: "double"
  },

  {
    char: "ㄽ",
    index: 12,
    type: "double"
  },

  {
    char: "ㄾ",
    index: 13,

/* ============================================================
   5. 선택 버튼 만들기
============================================================ */

function createChoiceGrid(
  data,
  container,
  type,
  checkedIndexes
) {

  container.innerHTML =
    "";


  data.forEach(
    item => {

      const wrapper =
        document.createElement(
          "div"
        );


      wrapper.className =
        "choice-item";


      if (
        type === "final" &&
        item.index === 0
      ) {

        wrapper.classList.add(
          "no-final-item"
        );

      }


      const input =
        document.createElement(
          "input"
        );


      input.type =
        "checkbox";


      input.id =
        `${type}-${item.index}`;


      input.value =
        item.index;


      input.checked =
        checkedIndexes.includes(
          item.index
        );


      const label =
        document.createElement(
          "label"
        );


      label.htmlFor =
        input.id;


      label.textContent =
        item.display ||
        item.char;


      /*
        선택이 변경될 때마다
        요약 업데이트
      */
      input.addEventListener(
        "change",
        updateSelectionSummary
      );


      wrapper.appendChild(
        input
      );


      wrapper.appendChild(
        label
      );


      container.appendChild(
        wrapper
      );

    }
  );

}


/*
  초기 생성
*/

createChoiceGrid(
  consonants,
  consonantGrid,
  "consonant",
  defaultConsonantIndexes
);

createChoiceGrid(

/* ============================================================
   6. 한글 조합 공식
============================================================ */

function makeHangul(
  choIndex,
  jungIndex,
  jongIndex
) {

  const code =

    0xAC00 +

    (
      choIndex *
      21 *
      28
    ) +

    (
      jungIndex *
      28
    ) +

    jongIndex;


  return String.fromCharCode(
    code
  );

}


/* ============================================================
   7. 선택한 요소 가져오기
============================================================ */

function getSelectedItems(
  container,
  data
) {

  const checked =
    container.querySelectorAll(
      'input[type="checkbox"]:checked'
    );


  return [...checked]

    .map(
      input =>

        data.find(
          item =>
            item.index ===
            Number(
              input.value
            )
        )

    )

    .filter(Boolean);

}


function getSelectedConsonants() {

  return getSelectedItems(
    consonantGrid,
    consonants
  );

}


function getSelectedVowels() {

  return getSelectedItems(
    vowelGrid,
    vowels
  );

}


function getSelectedFinals() {

  return getSelectedItems(
    finalGrid,
    finals
  );

}


/* ============================================================
   8. 선택 정보 표시
============================================================ */

function updateSelectionSummary() {

  const selectedConsonants =
    getSelectedConsonants();


  const selectedVowels =
    getSelectedVowels();


  const selectedFinals =
    getSelectedFinals();


  selectedConsonantsText.textContent =

    selectedConsonants.length === 0

      ? "선택 없음"

      : selectedConsonants
          .map(
            item =>
              item.char
          )
          .join(" ");


  selectedVowelsText.textContent =

    selectedVowels.length === 0

      ? "선택 없음"

      : selectedVowels
          .map(
            item =>
              item.char
          )
          .join(" ");


  selectedFinalsText.textContent =

    selectedFinals.length === 0

      ? "선택 없음"

      : selectedFinals
          .map(
            item =>
              item.index === 0
                ? "없음"
                : item.char
          )
          .join(" ");


  const total =

    selectedConsonants.length *

    selectedVowels.length *

    selectedFinals.length;


  combinationCount.textContent =
    `${total.toLocaleString()}개`;

}


/* ============================================================
   9. 선택된 자모로 무작위 조합
============================================================ */

function generateRandomItem() {

  const selectedConsonants =
    getSelectedConsonants();


  const selectedVowels =
    getSelectedVowels();


  const selectedFinals =
    getSelectedFinals();


  if (
    selectedConsonants.length === 0
  ) {

    alert(
      "초성을 한 개 이상 선택해 주세요."
    );

    return null;

  }


  if (
    selectedVowels.length === 0
  ) {

    alert(
      "모음을 한 개 이상 선택해 주세요."
    );

    return null;

  }


  if (
    selectedFinals.length === 0
  ) {

    alert(
      "받침을 선택해 주세요.\n\n받침 없는 글자를 연습하려면 '없음'을 선택하면 됩니다."
    );

    return null;

  }


  let item = null;

  let tryCount = 0;


  do {

    const consonant =

      selectedConsonants[
        Math.floor(
          Math.random() *
          selectedConsonants.length
        )
      ];


    const vowel =

      selectedVowels[
        Math.floor(
          Math.random() *
          selectedVowels.length
        )
      ];


    const final =

      selectedFinals[
        Math.floor(
          Math.random() *
          selectedFinals.length
        )
      ];


    const character =

      makeHangul(
        consonant.index,
        vowel.index,
        final.index
      );


    item = {

      char:
        character,

      consonant:
        consonant.char,

      vowel:
        vowel.char,

      final:
        final.index === 0
          ? ""
          : final.char,

      choIndex:
        consonant.index,

      jungIndex:
        vowel.index,

      jongIndex:
        final.index

    };


    tryCount++;


  } while (

    item.char ===
      previousCharacter &&

    tryCount < 40

  );


  previousCharacter =
    item.char;


  return item;

}


/* ============================================================
   10. 문제 표시
============================================================ */

function displayItem(
  item
) {

  if (!item) return;


  currentItem =
    item;


  letterElement.textContent =
    item.char;


  if (
    item.final
  ) {

    compositionElement.textContent =

      `${item.consonant} + ${item.vowel} + ${item.final}`;

  } else {

    compositionElement.textContent =

      `${item.consonant} + ${item.vowel}`;

  }


  updateCompositionVisibility();

}


/* ============================================================
   11. 다음 문제
============================================================ */

function nextItem() {

  if (
    !gameStarted
  ) {

    return;

  }


  /*
    오답 연습
  */
  if (
    reviewMode
  ) {

    if (
      reviewQueue.length === 0
    ) {

      finishReview();

      return;

    }


    displayItem(
      reviewQueue[0]
    );


    return;

  }


  const item =
    generateRandomItem();


  if (
    item
  ) {

    displayItem(
      item
    );

  }

}


/* ============================================================
   12. 맞음
============================================================ */

function handleCorrect() {

  if (
    !gameStarted ||
    !currentItem
  ) {

    return;

  }


  correctCount++;

  attempts++;


  /*
    오답 연습에서는
    맞힌 글자를 목록에서 제거
  */
  if (
    reviewMode
  ) {

    reviewQueue.shift();


    updateScoreBoard();


    if (
      reviewQueue.length === 0
    ) {

      finishReview();

      return;

    }


    nextItem();

    return;

  }


  updateScoreBoard();

  nextItem();

}


/* ============================================================
   13. 틀림
============================================================ */

function handleWrong() {

  if (
    !gameStarted ||
    !currentItem
  ) {

    return;

  }


  attempts++;

  wrongCount++;


  /*
    오답 복습 도중 다시 틀린 경우

    해당 글자를 맨 뒤로 이동
  */
  if (
    reviewMode
  ) {

    if (
      reviewQueue.length > 1
    ) {

      const item =
        reviewQueue.shift();


      reviewQueue.push(
        item
      );

    }


    updateScoreBoard();

    nextItem();

    return;

  }


  /*
    일반 학습 오답 저장
  */

  if (
    wrongHistory.has(
      currentItem.char
    )
  ) {

    const saved =
      wrongHistory.get(
        currentItem.char
      );


    saved.count++;


  } else {


    wrongHistory.set(
      currentItem.char,
      {
        ...currentItem,
        count: 1
      }
    );

  }


  updateWrongList();

  updateScoreBoard();

  nextItem();

}


/* ============================================================
   14. 기록 업데이트
============================================================ */

function updateScoreBoard() {

  correctCountElement.textContent =
    correctCount;


  attemptCountElement.textContent =
    attempts;


  const accuracy =

    attempts === 0

      ? 0

      : Math.round(
          correctCount /
          attempts *
          100
        );


  accuracyElement.textContent =
    `${accuracy}%`;

}

    !gameStarted

    return;

  correctButton.disabled =
    true;


  wrongButton.disabled =

  showResult(

    "연습을 마쳤습니다."
  );

}


/* ============================================================
   17. 오답 복습
============================================================ */

function startWrongReview() {

  if (
    wrongHistory.size === 0
  ) {

    alert(
      "다시 연습할 틀린 글자가 없습니다."
    );

    return;

  }


  closeModal();


  reviewQueue =

    Array
      .from(
        wrongHistory.values()
      )
      .map(
        item => ({
          ...item
        })
      );


  shuffle(
    reviewQueue
  );


  correctCount =
    0;


  attempts =
    0;


  wrongCount =
    0;


  reviewMode =
    true;


  gameStarted =
    true;


  correctButton.disabled =
    false;


  wrongButton.disabled =
    false;


  finishButton.disabled =
    false;


  modeBadge.textContent =
    `오답 연습 ${reviewQueue.length}글자`;


  updateScoreBoard();

  nextItem();

}


/* ============================================================
   18. 오답 복습 완료
============================================================ */

function finishReview() {

  gameStarted =
    false;


  correctButton.disabled =
    true;


  wrongButton.disabled =
    true;


  finishButton.disabled =
    true;


  modeBadge.textContent =
    "오답 연습 완료";


  wrongHistory.clear();


  updateWrongList();


  showResult(
    "⭐",
    "오답 연습 완료!",
    "틀렸던 글자를 모두 정확하게 읽었습니다."
  );

}


/* ============================================================
   19. 오답 목록
============================================================ */

function updateWrongList() {

  wrongList.innerHTML =
    "";


  if (
    wrongHistory.size === 0
  ) {

    const empty =
      document.createElement(
        "span"
      );


    empty.className =
      "empty-text";


    empty.textContent =
      "아직 틀린 글자가 없습니다.";


    wrongList.appendChild(
      empty
    );


    reviewButton.disabled =
      true;


    return;

  }


  wrongHistory.forEach(
    item => {

      const chip =
        document.createElement(
          "span"
        );


      chip.className =
        "wrong-chip";


      chip.textContent =

        item.count > 1

          ? `${item.char} ×${item.count}`

          : item.char;


      wrongList.appendChild(
        chip
      );

    }
  );


  reviewButton.disabled =
    false;

}


/* ============================================================
   20. 결과 표시
============================================================ */

function showResult(
  icon,
  title,
  message
) {

  const accuracy =

    attempts === 0

      ? 0

      : Math.round(
          correctCount /
          attempts *
          100
        );


  document
    .getElementById(
      "modalIcon"
    )
    .textContent =
      icon;


  document
    .getElementById(
      "modalTitle"
    )
    .textContent =
      title;


  document
    .getElementById(
      "modalMessage"
    )
    .textContent =
      message;


  resultCorrect.textContent =
    correctCount;


  resultAttempts.textContent =
    attempts;


  resultWrong.textContent =
    wrongCount;


  resultAccuracy.textContent =
    `${accuracy}%`;


  /*
    오답이 있을 때만
    오답 복습 버튼 표시
  */

  if (
    !reviewMode &&
    wrongHistory.size > 0
  ) {

    modalReviewButton.style.display =
      "block";

  } else {

    modalReviewButton.style.display =
      "none";

  }


  resultModal.classList.add(
    "show"
  );

}


function closeModal() {

  resultModal.classList.remove(
    "show"
  );

}


/* ============================================================
   21. 자모 조합 표시
============================================================ */

function updateCompositionVisibility() {

  if (
    showComposition
  ) {

    compositionElement
      .classList
      .remove(
        "hidden"
      );


    compositionButton.textContent =
      "조합 숨기기";


  } else {


    compositionElement
      .classList
      .add(
        "hidden"
      );


    compositionButton.textContent =
      "조합 보기";

  }

}


/* ============================================================
   22. 음성
============================================================ */

function speakCurrentCharacter() {

  if (
    !currentItem
  ) {

    return;

  }


  if (
    !(
      "speechSynthesis"
      in window
    )
  ) {

    alert(
      "이 브라우저에서는 음성 읽기 기능을 사용할 수 없습니다."
    );

    return;

  }


  window
    .speechSynthesis
    .cancel();


  const utterance =

    new SpeechSynthesisUtterance(
      currentItem.char
    );


  utterance.lang =
    "ko-KR";


  utterance.rate =
    0.7;


  utterance.pitch =
    1;


  window
    .speechSynthesis
    .speak(
      utterance
    );

}


/* ============================================================
   23. 체크박스 제어
============================================================ */

function setCheckedIndexes(
  container,
  indexes
) {

  const inputs =
    container.querySelectorAll(
      'input[type="checkbox"]'
    );


  inputs.forEach(
    input => {

      input.checked =
        indexes.includes(
          Number(
            input.value
          )
        );

    }
  );


  updateSelectionSummary();

}


function selectAll(
  container
) {

  const inputs =
    container.querySelectorAll(
      'input[type="checkbox"]'
    );


  inputs.forEach(
    input => {

      input.checked =
        true;

    }
  );


  updateSelectionSummary();

}


function clearAll(
  container
) {

  const inputs =
    container.querySelectorAll(
      'input[type="checkbox"]'
    );


  inputs.forEach(
    input => {

      input.checked =
        false;

    }
  );


  updateSelectionSummary();

}


/* ============================================================
   24. 배열 섞기
============================================================ */

function shuffle(
  array
) {

  for (
    let i =
      array.length - 1;

    i > 0;

    i--
  ) {

    const j =

      Math.floor(
        Math.random() *
        (i + 1)
      );


    [
      array[i],
      array[j]
    ] = [
      array[j],
      array[i]
    ];

  }


  return array;

}
