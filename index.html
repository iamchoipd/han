<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
>

<title>한글 읽기 연습</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  background: #f4f6fa;
  color: #222;
  font-family:
    "Pretendard",
    "Noto Sans KR",
    "Malgun Gothic",
    sans-serif;
}

button,
input {
  font-family: inherit;
}

button {
  cursor: pointer;
  touch-action: manipulation;
}

.app {
  width: min(800px, 100%);
  min-height: 100vh;
  margin: 0 auto;
  padding: 16px;
}

.title {
  text-align: center;
  margin: 8px 0 18px;
  font-size: clamp(28px, 6vw, 40px);
  font-weight: 900;
}

.card {
  background: white;
  border-radius: 22px;
  padding: 20px;
  margin-bottom: 14px;
  box-shadow: 0 8px 28px rgba(0,0,0,0.055);
}

/* 점수 */

.score-board {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.score-item {
  padding: 12px 6px;
  border-radius: 16px;
  background: #f4f6fa;
  text-align: center;
}

.score-label {
  display: block;
  margin-bottom: 5px;
  color: #666;
  font-size: 13px;
}

.score-value {
  font-size: clamp(21px, 5vw, 28px);
  font-weight: 900;
}

/* 제목 */

.section-title {
  margin-bottom: 12px;
  font-size: 18px;
  font-weight: 900;
}

/* 연습 방식 */

.mode-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
}

.mode-button {
  min-height: 63px;
  border: 2px solid #e0e4eb;
  border-radius: 16px;
  background: white;
  color: #333;
  font-size: 18px;
  font-weight: 900;
}

.mode-button.selected {
  border-color: #4c7df3;
  background: #eef3ff;
  color: #315fc7;
}

.description {
  margin-top: 11px;
  padding: 12px 14px;
  border-radius: 12px;
  background: #f5f7fb;
  color: #555;
  font-size: 14px;
  line-height: 1.55;
}

/* 글자 수 */

.length-buttons {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
}

.length-button {
  min-height: 58px;
  border: 2px solid #e0e4eb;
  border-radius: 15px;
  background: #fff;
  color: #333;
  font-size: 18px;
  font-weight: 900;
}

.length-button.selected {
  border-color: #4c7df3;
  background: #eef3ff;
  color: #315fc7;
}

.length-button:disabled {
  opacity: 0.3;
  cursor: default;
}

/* 문제 */

.practice-card {
  text-align: center;
  padding-top: 25px;
  padding-bottom: 25px;
}

.mode-badge {
  display: inline-block;
  padding: 7px 14px;
  margin-bottom: 8px;
  border-radius: 999px;
  background: #eef3ff;
  color: #315fc7;
  font-size: 14px;
  font-weight: 900;
}

.letter {
  display: flex;
  justify-content: center;
  align-items: center;

  min-height: 210px;
  padding: 10px;

  font-size: clamp(75px, 21vw, 160px);
  line-height: 1.1;
  letter-spacing: 0.03em;
  font-weight: 900;

  word-break: keep-all;
  user-select: none;
}

.letter.single-letter {
  font-size: clamp(125px, 32vw, 205px);
}

.letter.three-letter {
  font-size: clamp(63px, 18vw, 125px);
}

.composition {
  min-height: 48px;
  font-size: clamp(19px, 5vw, 29px);
  color: #555;
  font-weight: 900;
  line-height: 1.65;
}

.composition-part {
  display: inline-block;
  padding: 2px 5px;
}

.composition-divider {
  color: #aaa;
  margin: 0 2px;
}

.hidden {
  visibility: hidden;
}

.sub-buttons {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
}

.small-button {
  border: 0;
  padding: 10px 15px;
  border-radius: 12px;
  background: #edf0f5;
  color: #333;
  font-size: 15px;
  font-weight: 800;
}

/* 맞음 틀림 */

.answer-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 20px;
}

.answer-button {
  min-height: 84px;
  border: 0;
  border-radius: 20px;
  font-size: clamp(24px, 6vw, 34px);
  font-weight: 900;
}

.answer-button:active {
  transform: scale(0.97);
}

.answer-button:disabled {
  opacity: 0.35;
  cursor: default;
}

.correct-button {
  background: #dff8e7;
  color: #137c39;
}

.wrong-button {
  background: #ffe5e5;
  color: #c32d2d;
}

/* 선택 영역 */

details {
  margin-bottom: 12px;
  overflow: hidden;
  border-radius: 20px;
  background: white;
  box-shadow: 0 5px 20px rgba(0,0,0,0.04);
}

summary {
  padding: 17px 18px;
  cursor: pointer;
  font-size: 18px;
  font-weight: 900;
  user-select: none;
}

.settings-body {
  padding: 0 18px 18px;
}

.mini-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-bottom: 10px;
}

.mini-actions button {
  border: 0;
  padding: 9px 12px;
  border-radius: 10px;
  background: #eceff5;
  color: #222;
  font-size: 14px;
  font-weight: 800;
}

.mini-actions .double-final-button {
  background: #fff1cf;
  color: #765000;
}

.mini-actions .clear-button {
  background: #ffeaea;
  color: #b52727;
}

/* 선택 칸 */

.choice-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 7px;
}

.choice-item {
  position: relative;
}

.choice-item input {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}

.choice-item label {
  display: flex;
  justify-content: center;
  align-items: center;

  min-height: 51px;

  border: 2px solid #e3e6eb;
  border-radius: 13px;

  background: white;

  font-size: 21px;
  font-weight: 900;

  cursor: pointer;
  user-select: none;
}

.choice-item input:checked + label {
  border-color: #4c7df3;
  background: #eef3ff;
  color: #315fc7;
}

.choice-item.double-final label {
  border-style: dashed;
}

.choice-item.double-final input:checked + label {
  border-style: solid;
  background: #fff7df;
  color: #875b00;
  border-color: #e1aa36;
}

.no-final-item label {
  font-size: 15px;
}

/* 현재 선택 */

.selection-summary {
  font-size: 14px;
  line-height: 1.75;
}

.selection-row {
  margin: 3px 0;
}

.selection-label {
  display: inline-block;
  min-width: 78px;
  font-weight: 900;
}

.selection-value {
  color: #444;
}

.highlight {
  color: #315fc7;
  font-weight: 900;
}

/* 시작 */

.main-buttons {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 9px;
  margin-top: 12px;
}

.start-button {
  min-height: 65px;
  border: 0;
  border-radius: 18px;
  background: #4c7df3;
  color: white;
  font-size: 22px;
  font-weight: 900;
}

.finish-button {
  min-height: 65px;
  border: 0;
  border-radius: 18px;
  background: #eceff4;
  color: #333;
  font-size: 18px;
  font-weight: 900;
}

.finish-button:disabled {
  opacity: 0.4;
}

.review-button {
  width: 100%;
  min-height: 56px;
  margin-top: 9px;
  border: 0;
  border-radius: 16px;
  background: #fff1cf;
  color: #805600;
  font-size: 18px;
  font-weight: 900;
}

.review-button:disabled {
  opacity: 0.4;
}

/* 오답 */

.wrong-title {
  margin-bottom: 10px;
  font-weight: 900;
}

.wrong-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.wrong-chip {
  padding: 8px 12px;
  border-radius: 12px;
  background: #fff0f0;
  color: #b72a2a;
  font-size: 19px;
  font-weight: 900;
}

.empty-text {
  color: #888;
  font-size: 14px;
}

/* 결과 */

.modal-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100;

  align-items: center;
  justify-content: center;

  padding: 20px;
  background: rgba(0,0,0,0.5);
}

.modal-backdrop.show {
  display: flex;
}

.modal {
  width: min(470px,100%);
  max-height: 90vh;
  overflow-y: auto;

  padding: 26px;
  border-radius: 24px;
  background: white;
  text-align: center;
}

.modal-icon {
  font-size: 56px;
}

.modal h2 {
  margin: 6px 0 13px;
  font-size: 28px;
}

.result-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin: 18px 0;
}

.result-box {
  padding: 14px;
  border-radius: 15px;
  background: #f4f6fa;
}

.result-label {
  display: block;
  margin-bottom: 4px;
  color: #777;
  font-size: 13px;
}

.result-value {
  font-size: 24px;
  font-weight: 900;
}

.modal-button {
  width: 100%;
  min-height: 52px;
  margin-top: 8px;
  border: 0;
  border-radius: 15px;
  font-size: 17px;
  font-weight: 900;
}

.primary-modal-button {
  background: #4c7df3;
  color: white;
}

.secondary-modal-button {
  background: #fff1cf;
  color: #765000;
}

.gray-modal-button {
  background: #eceff4;
  color: #333;
}

@media (max-width:480px) {

  .app {
    padding: 10px;
  }

  .card {
    padding: 15px;
  }

  .letter {
    min-height: 165px;
  }

  .choice-grid {
    grid-template-columns: repeat(5,1fr);
    gap: 5px;
  }

  .choice-item label {
    min-height: 47px;
    font-size: 19px;
  }

  .no-final-item label {
    font-size: 13px;
  }

  .answer-button {
    min-height: 75px;
  }

  .main-buttons {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<main class="app">

<h1 class="title">
  한글 읽기 연습
</h1>

<!-- 기록 -->

<section class="card">

  <div class="score-board">

    <div class="score-item">

      <span class="score-label">
        맞음
      </span>

      <strong
        class="score-value"
        id="correctCount"
      >
        0
      </strong>

    </div>

    <div class="score-item">

      <span class="score-label">
        시도
      </span>

      <strong
        class="score-value"
        id="attemptCount"
      >
        0
      </strong>

    </div>

    <div class="score-item">

      <span class="score-label">
        정답률
      </span>

      <strong
        class="score-value"
        id="accuracy"
      >
        0%
      </strong>

    </div>

  </div>

</section>

<!-- 연습 방식 -->

<section class="card">

  <div class="section-title">
    📚 연습 방식
  </div>

  <div class="mode-buttons">

    <button
      class="mode-button selected"
      id="randomModeButton"
      type="button"
    >
      🔤 무작위 조합
    </button>

    <button
      class="mode-button"
      id="wordModeButton"
      type="button"
    >
      📖 실제 단어
    </button>

  </div>

  <div
    class="description"
    id="modeDescription"
  >
    선택한 초성·모음·받침을 무작위로 조합합니다.
  </div>

</section>

<!-- 글자 수 -->

<section class="card">

  <div class="section-title">
    🔢 글자 수
  </div>

  <div class="length-buttons">

    <button
      class="length-button selected"
      data-length="1"
      type="button"
    >
      1글자
    </button>

    <button
      class="length-button"
      data-length="2"
      type="button"
    >
      2글자
    </button>

    <button
      class="length-button"
      data-length="3"
      type="button"
    >
      3글자
    </button>

  </div>

  <div
    class="description"
    id="lengthDescription"
  >
    한 글자를 만들어 읽습니다.
  </div>

</section>

<!-- 문제 -->

<section class="card practice-card">

  <div
    class="mode-badge"
    id="modeBadge"
  >
    연습 준비
  </div>

  <div
    class="letter single-letter"
    id="letter"
  >
    가
  </div>

  <div
    class="composition"
    id="composition"
  >
    ㄱ + ㅏ
  </div>

  <div class="sub-buttons">

    <button
      class="small-button"
      id="compositionButton"
      type="button"
    >
      조합 숨기기
    </button>

    <button
      class="small-button"
      id="speakButton"
      type="button"
    >
      🔊 소리 듣기
    </button>

  </div>

  <div class="answer-buttons">

    <button
      class="answer-button correct-button"
      id="correctButton"
      type="button"
      disabled
    >
      ✅ 맞음
    </button>

    <button
      class="answer-button wrong-button"
      id="wrongButton"
      type="button"
      disabled
    >
      ❌ 틀림
    </button>

  </div>

</section>

<!-- 초성 -->

<details open>

  <summary>
    ㄱ 초성 선택
  </summary>

  <div class="settings-body">

    <div class="mini-actions">

      <button
        id="basicConsonants"
        type="button"
      >
        기본 자음
      </button>

      <button
        id="allConsonants"
        type="button"
      >
        전체 선택
      </button>

      <button
        class="clear-button"
        id="clearConsonants"
        type="button"
      >
        전체 해제
      </button>

    </div>

    <div
      class="choice-grid"
      id="consonantGrid"
    ></div>

  </div>

</details>

<!-- 모음 -->

<details open>

  <summary>
    ㅏ 모음 선택
  </summary>

  <div class="settings-body">

    <div class="mini-actions">

      <button
        id="basicVowels"
        type="button"
      >
        기본 모음
      </button>

      <button
        id="allVowels"
        type="button"
      >
        전체 선택
      </button>

      <button
        class="clear-button"
        id="clearVowels"
        type="button"
      >
        전체 해제
      </button>

    </div>

    <div
      class="choice-grid"
      id="vowelGrid"
    ></div>

  </div>

</details>

<!-- 받침 -->

<details open>

  <summary>
    ㄴ 받침 선택
  </summary>

  <div class="settings-body">

    <div class="mini-actions">

      <button
        id="noFinalOnly"
        type="button"
      >
        받침 없음
      </button>

      <button
        id="basicFinals"
        type="button"
      >
        기본 받침
      </button>

      <button
        id="simpleFinals"
        type="button"
      >
        홑받침 전체
      </button>

      <button
        class="double-final-button"
        id="doubleFinals"
        type="button"
      >
        겹받침 연습
      </button>

      <button
        id="allFinals"
        type="button"
      >
        전체 받침
      </button>

      <button
        class="clear-button"
        id="clearFinals"
        type="button"
      >
        전체 해제
      </button>

    </div>

    <div
      class="choice-grid"
      id="finalGrid"
    ></div>

  </div>

</details>

<!-- 현재 선택 -->

<section class="card">

  <div class="section-title">
    🔎 현재 선택
  </div>

  <div class="selection-summary">

    <div class="selection-row">

      <span class="selection-label">
        연습 방식
      </span>

      <strong
        class="highlight"
        id="selectedModeText"
      >
        무작위 조합
      </strong>

    </div>

    <div class="selection-row">

      <span class="selection-label">
        글자 수
      </span>

      <strong
        class="highlight"
        id="selectedLengthText"
      >
        1글자
      </strong>

    </div>

    <div class="selection-row">

      <span class="selection-label">
        초성
      </span>

      <span
        class="selection-value"
        id="selectedConsonantsText"
      ></span>

    </div>

    <div class="selection-row">

      <span class="selection-label">
        모음
      </span>

      <span
        class="selection-value"
        id="selectedVowelsText"
      ></span>

    </div>

    <div class="selection-row">

      <span class="selection-label">
        받침
      </span>

      <span
        class="selection-value"
        id="selectedFinalsText"
      ></span>

    </div>

    <div class="selection-row">

      <span
        class="selection-label"
        id="resultTypeLabel"
      >
        전체 조합
      </span>

      <strong
        class="highlight"
        id="combinationCount"
      >
        0개
      </strong>

    </div>

  </div>

</section>

<!-- 시작 -->

<div class="main-buttons">

  <button
    class="start-button"
    id="startButton"
    type="button"
  >
    ▶ 연습 시작
  </button>

  <button
    class="finish-button"
    id="finishButton"
    type="button"
    disabled
  >
    ■ 연습 종료
  </button>

</div>

<button
  class="review-button"
  id="reviewButton"
  type="button"
  disabled
>
  🔁 틀린 글자 다시 연습
</button>

<!-- 오답 -->

<section
  class="card"
  style="margin-top:16px;"
>

  <div class="wrong-title">
    ❌ 틀린 글자
  </div>

  <div
    class="wrong-list"
    id="wrongList"
  >

    <span class="empty-text">
      아직 틀린 글자가 없습니다.
    </span>

  </div>

</section>

</main>

<!-- 결과 -->

<div
  class="modal-backdrop"
  id="resultModal"
>

  <div class="modal">

    <div
      class="modal-icon"
      id="modalIcon"
    >
      📊
    </div>

    <h2 id="modalTitle">
      연습 결과
    </h2>

    <p id="modalMessage">
      연습을 마쳤습니다.
    </p>

    <div class="result-grid">

      <div class="result-box">

        <span class="result-label">
          맞은 수
        </span>

        <strong
          class="result-value"
          id="resultCorrect"
        >
          0
        </strong>

      </div>

      <div class="result-box">

        <span class="result-label">
          전체 시도
        </span>

        <strong
          class="result-value"
          id="resultAttempts"
        >
          0
        </strong>

      </div>

      <div class="result-box">

        <span class="result-label">
          틀린 횟수
        </span>

        <strong
          class="result-value"
          id="resultWrong"
        >
          0
        </strong>

      </div>

      <div class="result-box">

        <span class="result-label">
          정답률
        </span>

        <strong
          class="result-value"
          id="resultAccuracy"
        >
          0%
        </strong>

      </div>

    </div>

    <button
      class="modal-button secondary-modal-button"
      id="modalReviewButton"
      type="button"
    >
      🔁 오답 다시 연습
    </button>

    <button
      class="modal-button primary-modal-button"
      id="modalNewButton"
      type="button"
    >
      ▶ 새 연습 시작
    </button>

    <button
      class="modal-button gray-modal-button"
      id="closeModalButton"
      type="button"
    >
      결과 닫기
    </button>

  </div>

</div>

<script>

/* =========================================================
   초성
========================================================= */

const consonants = [

  { char:"ㄱ", index:0 },
  { char:"ㄲ", index:1 },
  { char:"ㄴ", index:2 },
  { char:"ㄷ", index:3 },
  { char:"ㄸ", index:4 },

  { char:"ㄹ", index:5 },
  { char:"ㅁ", index:6 },
  { char:"ㅂ", index:7 },
  { char:"ㅃ", index:8 },
  { char:"ㅅ", index:9 },

  { char:"ㅆ", index:10 },
  { char:"ㅇ", index:11 },
  { char:"ㅈ", index:12 },
  { char:"ㅉ", index:13 },
  { char:"ㅊ", index:14 },

  { char:"ㅋ", index:15 },
  { char:"ㅌ", index:16 },
  { char:"ㅍ", index:17 },
  { char:"ㅎ", index:18 }

];

/* =========================================================
   선택 버튼
========================================================= */

function createChoiceGrid(
  data,
  container,
  type,
  checkedIndexes
) {

  container.innerHTML =
    "";


  data.forEach(
    item => {

      const wrapper =
        document.createElement("div");


      wrapper.className =
        "choice-item";


      if (
        type === "final" &&
        item.index === 0
      ) {

        wrapper.classList.add(
          "no-final-item"
        );

      }


      if (
        type === "final" &&
        item.type === "double"
      ) {

        wrapper.classList.add(
          "double-final"
        );

      }


      const input =
        document.createElement("input");


      input.type =
        "checkbox";


      input.id =
        `${type}-${item.index}`;


      input.value =
        item.index;


      input.checked =
        checkedIndexes.includes(
          item.index
        );


      const label =
        document.createElement("label");


      label.htmlFor =
        input.id;


      label.textContent =
        item.display ||
        item.char;


      input.addEventListener(
        "change",
        updateSelectionSummary
      );


      wrapper.appendChild(input);

      wrapper.appendChild(label);

      container.appendChild(wrapper);

    }
  );

}

/* =========================================================
   한글 만들기
========================================================= */

function makeHangul(
  choIndex,
  jungIndex,
  jongIndex
) {

  const code =

    0xAC00 +

    (
      choIndex *
      21 *
      28
    ) +

    (
      jungIndex *
      28
    ) +

    jongIndex;


  return String.fromCharCode(
    code
  );

}


/* =========================================================
   한글 분해
========================================================= */

function decomposeHangul(
  char
) {

  const code =
    char.charCodeAt(0);


  if (
    code < 0xAC00 ||
    code > 0xD7A3
  ) {

    return null;

  }


  const value =
    code - 0xAC00;


  const choIndex =

    Math.floor(
      value /
      (21 * 28)
    );


  const jungIndex =

    Math.floor(
      (
        value %
        (21 * 28)
      ) /
      28
    );


  const jongIndex =
    value % 28;


  return {

    char,

    consonant:
      consonants[
        choIndex
      ].char,

    vowel:
      vowels[
        jungIndex
      ].char,

    final:

      jongIndex === 0

        ? ""

        : finals[
            jongIndex
          ].char,

    choIndex,

    jungIndex,

    jongIndex

  };

}


/* =========================================================
   선택된 항목
========================================================= */

function getSelectedItems(
  container,
  data
) {

  const checked =

    container.querySelectorAll(
      'input[type="checkbox"]:checked'
    );


  return [...checked]

    .map(
      input =>

        data.find(
          item =>
            item.index ===
            Number(input.value)
        )

    )

    .filter(Boolean);

}


function getSelectedConsonants() {

  return getSelectedItems(
    consonantGrid,
    consonants
  );

}


function getSelectedVowels() {

  return getSelectedItems(
    vowelGrid,
    vowels
  );

}


function getSelectedFinals() {

  return getSelectedItems(
    finalGrid,
    finals
  );

}


/* =========================================================
   실제 단어 데이터 변환
========================================================= */

function wordToItem(
  word
) {

  const syllables =

    [...word]

      .map(
        char =>
          decomposeHangul(
            char
          )
      )

      .filter(Boolean);


  return {

    char:
      word,

    syllables,

    length:
      syllables.length

  };

}


/* =========================================================
   선택 조건에 맞는 실제 단어
========================================================= */

function getFilteredWords() {

  if (
    selectedLength !== 2 &&
    selectedLength !== 3
  ) {

    return [];

  }


  const selectedConsonants =
    getSelectedConsonants();


  const selectedVowels =
    getSelectedVowels();


  const selectedFinals =
    getSelectedFinals();


  if (
    selectedConsonants.length === 0 ||
    selectedVowels.length === 0 ||
    selectedFinals.length === 0
  ) {

    return [];

  }


  const consonantSet =
    new Set(
      selectedConsonants.map(
        item =>
          item.index
      )
    );


  const vowelSet =
    new Set(
      selectedVowels.map(
        item =>
          item.index
      )
    );


  const finalSet =
    new Set(
      selectedFinals.map(
        item =>
          item.index
      )
    );


  const words =
    wordBank[selectedLength] || [];


  return words.filter(
    word => {

      const characters =
        [...word];


      if (
        characters.length !==
        selectedLength
      ) {

        return false;

      }


      return characters.every(
        char => {

          const part =
            decomposeHangul(char);


          if (!part) {

            return false;

          }


          return (

            consonantSet.has(
              part.choIndex
            )

            &&

            vowelSet.has(
              part.jungIndex
            )

            &&

            finalSet.has(
              part.jongIndex
            )

          );

        }
      );

    }
  );

}

  updateLengthDescription();

  updateLetterSize();

  updateSelectionSummary();

}


/* =========================================================
   글자 수
========================================================= */

function setWordLength(
  length
) {

  length =
    Number(length);


  if (
    practiceMode === "word" &&
    length === 1
  ) {

    return;

  }


  selectedLength =
    length;


  refreshLengthButtons();

  updateLengthDescription();

  updateLetterSize();

  updateSelectionSummary();

}


function refreshLengthButtons() {

  lengthButtons.forEach(
    button => {

      button.classList.toggle(

        "selected",

        Number(
          button.dataset.length
        ) === selectedLength

      );

    }
  );


  selectedLengthText.textContent =
    `${selectedLength}글자`;

}


function updateLengthDescription() {

  if (
    practiceMode === "word"
  ) {

    lengthDescription.textContent =

      selectedLength === 2

        ? "실제 두 글자 단어를 읽습니다."

        : "실제 세 글자 단어를 읽습니다.";


    return;

  }


  lengthDescription.textContent =

    selectedLength === 1

      ? "한 글자를 만들어 읽습니다."

      : `${selectedLength}글자를 무작위로 조합합니다.`;

}


/* =========================================================
   글자 크기
========================================================= */

function updateLetterSize() {

  letterElement.classList.remove(
    "single-letter",
    "three-letter"
  );


  if (
    selectedLength === 1
  ) {

    letterElement.classList.add(
      "single-letter"
    );

  }


  if (
    selectedLength === 3
  ) {

    letterElement.classList.add(
      "three-letter"
    );

  }

}


/* =========================================================
   현재 선택
========================================================= */

function updateSelectionSummary() {

  const selectedConsonants =
    getSelectedConsonants();


  const selectedVowels =
    getSelectedVowels();


  const selectedFinals =
    getSelectedFinals();


  selectedConsonantsText.textContent =

    selectedConsonants.length === 0

      ? "선택 없음"

      : selectedConsonants
          .map(item => item.char)
          .join(" ");


  selectedVowelsText.textContent =

    selectedVowels.length === 0

      ? "선택 없음"

      : selectedVowels
          .map(item => item.char)
          .join(" ");


  selectedFinalsText.textContent =

    selectedFinals.length === 0

      ? "선택 없음"

      : selectedFinals
          .map(
            item =>
              item.index === 0
                ? "없음"
                : item.char
          )
          .join(" ");


  if (
    practiceMode === "word"
  ) {

    const availableWords =
      getFilteredWords();


    resultTypeLabel.textContent =
      "가능한 단어";


    combinationCount.textContent =
      `${availableWords.length}개`;


    return;

  }


  const oneSyllableCount =

    selectedConsonants.length *

    selectedVowels.length *

    selectedFinals.length;


  const total =

    Math.pow(
      oneSyllableCount,
      selectedLength
    );


  resultTypeLabel.textContent =
    "전체 조합";


  combinationCount.textContent =
    `${total.toLocaleString()}개`;

}


/* =========================================================
   무작위 한 음절
========================================================= */

function generateRandomSyllable() {

  const selectedConsonants =
    getSelectedConsonants();


  const selectedVowels =
    getSelectedVowels();


  const selectedFinals =
    getSelectedFinals();


  const consonant =

    selectedConsonants[
      Math.floor(
        Math.random() *
        selectedConsonants.length
      )
    ];


  const vowel =

    selectedVowels[
      Math.floor(
        Math.random() *
        selectedVowels.length
      )
    ];


  const final =

    selectedFinals[
      Math.floor(
        Math.random() *
        selectedFinals.length
      )
    ];


  return {

    char:
      makeHangul(
        consonant.index,
        vowel.index,
        final.index
      ),

    consonant:
      consonant.char,

    vowel:
      vowel.char,

    final:

      final.index === 0

        ? ""

        : final.char,

    choIndex:
      consonant.index,

    jungIndex:
      vowel.index,

    jongIndex:
      final.index

  };

}


/* =========================================================
   무작위 문제
========================================================= */

function generateRandomCombination() {

  let result =
    null;


  let tryCount =
    0;


  do {

    const syllables =
      [];


    for (
      let i = 0;
      i < selectedLength;
      i++
    ) {

      syllables.push(
        generateRandomSyllable()
      );

    }


    const text =

      syllables
        .map(item => item.char)
        .join("");


    result = {

      char:
        text,

      syllables,

      length:
        selectedLength

    };


    tryCount++;


  } while (

    result.char === previousCharacter &&
    tryCount < 50

  );


  previousCharacter =
    result.char;


  return result;

}


/* =========================================================
   실제 단어 문제
========================================================= */

function generateRealWord() {

  const words =
    getFilteredWords();


  if (
    words.length === 0
  ) {

    return null;

  }


  let word =

    words[
      Math.floor(
        Math.random() *
        words.length
      )
    ];


  if (
    words.length > 1
  ) {

    let tryCount =
      0;


    while (
      word === previousCharacter &&
      tryCount < 30
    ) {

      word =

        words[
          Math.floor(
            Math.random() *
            words.length
          )
        ];


      tryCount++;

    }

  }


  previousCharacter =
    word;


  return wordToItem(word);

}


/* =========================================================
   문제 생성
========================================================= */

function generateItem() {

  return practiceMode === "word"

    ? generateRealWord()

    : generateRandomCombination();

}


/* =========================================================
   조합 설명
========================================================= */

function buildCompositionHTML(
  item
) {

  if (
    !item ||
    !item.syllables
  ) {

    return "";

  }


  return item.syllables

    .map(
      syllable => {

        if (
          syllable.final
        ) {

          return `

            <span class="composition-part">

              ${syllable.consonant}
              +
              ${syllable.vowel}
              +
              ${syllable.final}

            </span>

          `;

        }


        return `

          <span class="composition-part">

            ${syllable.consonant}
            +
            ${syllable.vowel}

          </span>

        `;

      }
    )

    .join(
      `<span class="composition-divider"> / </span>`
    );

}


/* =========================================================
   문제 표시
========================================================= */

function displayItem(
  item
) {

  if (!item) return;


  currentItem =
    item;


  letterElement.textContent =
    item.char;


  compositionElement.innerHTML =
    buildCompositionHTML(item);


  updateCompositionVisibility();

}


/* =========================================================
   다음
========================================================= */

function nextItem() {

  if (!gameStarted) {

    return;

  }


  if (
    reviewMode
  ) {

    if (
      reviewQueue.length === 0
    ) {

      finishReview();

      return;

    }


    displayItem(
      reviewQueue[0]
    );


    return;

  }


  const item =
    generateItem();


  if (!item) {

    gameStarted =
      false;


    correctButton.disabled =
      true;


    wrongButton.disabled =
      true;


    finishButton.disabled =
      true;


    modeBadge.textContent =
      "선택 조건 확인";


    alert(
      "현재 선택 조건에 맞는 실제 단어가 없습니다.\n\n자음·모음·받침을 더 선택해 주세요."
    );


    return;

  }


  displayItem(item);

}


/* =========================================================
   맞음
========================================================= */

function handleCorrect() {

  if (
    !gameStarted ||
    !currentItem
  ) {

    return;

  }


  correctCount++;

  attempts++;


  if (
    reviewMode
  ) {

    reviewQueue.shift();


    updateScoreBoard();


    if (
      reviewQueue.length === 0
    ) {

      finishReview();

      return;

    }


    nextItem();

    return;

  }


  updateScoreBoard();

  nextItem();

}


/* =========================================================
   틀림
========================================================= */

function handleWrong() {

  if (
    !gameStarted ||
    !currentItem
  ) {

    return;

  }


  attempts++;

  wrongCount++;


  if (
    reviewMode
  ) {

    if (
      reviewQueue.length > 1
    ) {

      const item =
        reviewQueue.shift();


      reviewQueue.push(item);

    }


    updateScoreBoard();

    nextItem();

    return;

  }


  if (
    wrongHistory.has(
      currentItem.char
    )
  ) {

    const saved =
      wrongHistory.get(
        currentItem.char
      );


    saved.count++;

  }

  else {

    wrongHistory.set(

      currentItem.char,

      {
        ...currentItem,
        count:1
      }

    );

  }


  updateWrongList();

  updateScoreBoard();

  nextItem();

}


/* =========================================================
   점수판
========================================================= */

function updateScoreBoard() {

  correctCountElement.textContent =
    correctCount;


  attemptCountElement.textContent =
    attempts;


  const accuracy =

    attempts === 0

      ? 0

      : Math.round(
          correctCount /
          attempts *
          100
        );


  accuracyElement.textContent =
    `${accuracy}%`;

}


/* =========================================================
   조건 확인
========================================================= */

function selectionsAreValid() {

  if (
    getSelectedConsonants()
      .length === 0
  ) {

    alert(
      "초성을 한 개 이상 선택해 주세요."
    );

    return false;

  }


  if (
    getSelectedVowels()
      .length === 0
  ) {

    alert(
      "모음을 한 개 이상 선택해 주세요."
    );

    return false;

  }


  if (
    getSelectedFinals()
      .length === 0
  ) {

    alert(
      "받침을 한 개 이상 선택해 주세요."
    );

    return false;

  }


  if (
    practiceMode === "word" &&
    getFilteredWords().length === 0
  ) {

    alert(
      "현재 선택 조건에 맞는 실제 단어가 없습니다.\n\n자음·모음·받침을 더 선택해 주세요."
    );

    return false;

  }


  return true;

}


/* =========================================================
   시작
========================================================= */

function startNewPractice() {

  if (
    !selectionsAreValid()
  ) {

    return;

  }


  closeModal();


  correctCount =
    0;

  attempts =
    0;

  wrongCount =
    0;

  currentItem =
    null;

  previousCharacter =
    "";

  reviewMode =
    false;

  reviewQueue =
    [];


  wrongHistory.clear();


  gameStarted =
    true;


  correctButton.disabled =
    false;


  wrongButton.disabled =
    false;


  finishButton.disabled =
    false;


  modeBadge.textContent =

    practiceMode === "word"

      ? `${selectedLength}글자 실제 단어`

      : `${selectedLength}글자 무작위 조합`;


  updateScoreBoard();

  updateWrongList();

  nextItem();

}


/* =========================================================
   종료
========================================================= */

function finishPractice() {

  if (!gameStarted) return;


  gameStarted =
    false;


  correctButton.disabled =
    true;


  wrongButton.disabled =
    true;


  finishButton.disabled =
    true;


  modeBadge.textContent =
    "연습 종료";


  showResult(

    "📊",

    "연습 결과",

    "읽기 연습을 마쳤습니다."

  );

}


/* =========================================================
   오답
========================================================= */

function startWrongReview() {

  if (
    wrongHistory.size === 0
  ) {

    alert(
      "다시 연습할 틀린 글자가 없습니다."
    );

    return;

  }


  closeModal();


  reviewQueue =

    Array
      .from(
        wrongHistory.values()
      )

      .map(
        item => ({
          ...item
        })
      );


  shuffle(reviewQueue);


  correctCount =
    0;

  attempts =
    0;

  wrongCount =
    0;

  reviewMode =
    true;

  gameStarted =
    true;


  correctButton.disabled =
    false;

  wrongButton.disabled =
    false;

  finishButton.disabled =
    false;


  modeBadge.textContent =
    `오답 연습 ${reviewQueue.length}개`;


  updateScoreBoard();

  nextItem();

}


function finishReview() {

  gameStarted =
    false;


  correctButton.disabled =
    true;

  wrongButton.disabled =
    true;

  finishButton.disabled =
    true;


  modeBadge.textContent =
    "오답 연습 완료";


  wrongHistory.clear();


  updateWrongList();


  showResult(

    "⭐",

    "오답 연습 완료!",

    "틀렸던 글자를 모두 정확하게 읽었습니다."

  );

}


/* =========================================================
   오답 목록
========================================================= */

function updateWrongList() {

  wrongList.innerHTML =
    "";


  if (
    wrongHistory.size === 0
  ) {

    const empty =
      document.createElement("span");


    empty.className =
      "empty-text";


    empty.textContent =
      "아직 틀린 글자가 없습니다.";


    wrongList.appendChild(empty);


    reviewButton.disabled =
      true;


    return;

  }


  wrongHistory.forEach(
    item => {

      const chip =
        document.createElement("span");


      chip.className =
        "wrong-chip";


      chip.textContent =

        item.count > 1

          ? `${item.char} ×${item.count}`

          : item.char;


      wrongList.appendChild(chip);

    }
  );


  reviewButton.disabled =
    false;

}


/* =========================================================
   결과
========================================================= */

function showResult(
  icon,
  title,
  message
) {

  const accuracy =

    attempts === 0

      ? 0

      : Math.round(
          correctCount /
          attempts *
          100
        );


  document
    .getElementById("modalIcon")
    .textContent =
      icon;


  document
    .getElementById("modalTitle")
    .textContent =
      title;


  document
    .getElementById("modalMessage")
    .textContent =
      message;


  resultCorrect.textContent =
    correctCount;


  resultAttempts.textContent =
    attempts;


  resultWrong.textContent =
    wrongCount;


  resultAccuracy.textContent =
    `${accuracy}%`;


  modalReviewButton.style.display =

    !reviewMode &&
    wrongHistory.size > 0

      ? "block"

      : "none";


  resultModal.classList.add(
    "show"
  );

}


function closeModal() {

  resultModal.classList.remove(
    "show"
  );

}


/* =========================================================
   조합 표시
========================================================= */

function updateCompositionVisibility() {

  if (
    showComposition
  ) {

    compositionElement.classList.remove(
      "hidden"
    );


    compositionButton.textContent =
      "조합 숨기기";

  }

  else {

    compositionElement.classList.add(
      "hidden"
    );


    compositionButton.textContent =
      "조합 보기";

  }

}


/* =========================================================
   음성
========================================================= */

function speakCurrentCharacter() {

  if (!currentItem) return;


  if (
    !(
      "speechSynthesis"
      in window
    )
  ) {

    alert(
      "음성 기능을 사용할 수 없는 브라우저입니다."
    );

    return;

  }


  window
    .speechSynthesis
    .cancel();


  const utterance =

    new SpeechSynthesisUtterance(
      currentItem.char
    );


  utterance.lang =
    "ko-KR";


  utterance.rate =
    0.65;


  utterance.pitch =
    1;


  window
    .speechSynthesis
    .speak(utterance);

}


/* =========================================================
   선택 제어
========================================================= */

function setCheckedIndexes(
  container,
  indexes
) {

  const inputs =

    container.querySelectorAll(
      'input[type="checkbox"]'
    );


  inputs.forEach(
    input => {

      input.checked =

        indexes.includes(
          Number(input.value)
        );

    }
  );


  updateSelectionSummary();

}


function selectAll(
  container
) {

  const inputs =

    container.querySelectorAll(
      'input[type="checkbox"]'
    );


  inputs.forEach(
    input => {

      input.checked =
        true;

    }
  );


  updateSelectionSummary();

}


function clearAll(
  container
) {

  const inputs =

    container.querySelectorAll(
      'input[type="checkbox"]'
    );


  inputs.forEach(
    input => {

      input.checked =
        false;

    }
  );


  updateSelectionSummary();

}


/* =========================================================
   섞기
========================================================= */

function shuffle(
  array
) {

  for (
    let i =
      array.length - 1;
    i > 0;
    i--
  ) {

    const j =

      Math.floor(
        Math.random() *
        (i + 1)
      );


    [
      array[i],
      array[j]
    ] = [
      array[j],
      array[i]
    ];

  }


  return array;

}


/* =========================================================
   이벤트
========================================================= */

randomModeButton.addEventListener(
  "click",
  () => setPracticeMode("random")
);


wordModeButton.addEventListener(
  "click",
  () => setPracticeMode("word")
);


lengthButtons.forEach(
  button => {

    button.addEventListener(
      "click",
      () =>
        setWordLength(
          button.dataset.length
        )
    );

  }
);


correctButton.addEventListener(
  "click",
  handleCorrect
);


wrongButton.addEventListener(
  "click",
  handleWrong
);


startButton.addEventListener(
  "click",
  startNewPractice
);


finishButton.addEventListener(
  "click",
  finishPractice
);


reviewButton.addEventListener(
  "click",
  startWrongReview
);


compositionButton.addEventListener(
  "click",
  () => {

    showComposition =
      !showComposition;


    updateCompositionVisibility();

  }
);


speakButton.addEventListener(
  "click",
  speakCurrentCharacter
);


/* 초성 */

document
  .getElementById("basicConsonants")
  .addEventListener(
    "click",
    () => {

      setCheckedIndexes(
        consonantGrid,
        defaultConsonantIndexes
      );

    }
  );


document
  .getElementById("allConsonants")
  .addEventListener(
    "click",
    () =>
      selectAll(consonantGrid)
  );


document
  .getElementById("clearConsonants")
  .addEventListener(
    "click",
    () =>
      clearAll(consonantGrid)
  );


/* 모음 */

document
  .getElementById("basicVowels")
  .addEventListener(
    "click",
    () => {

      setCheckedIndexes(
        vowelGrid,
        defaultVowelIndexes
      );

    }
  );


document
  .getElementById("allVowels")
  .addEventListener(
    "click",
    () =>
      selectAll(vowelGrid)
  );


document
  .getElementById("clearVowels")
  .addEventListener(
    "click",
    () =>
      clearAll(vowelGrid)
  );


/* 받침 없음 */

document
  .getElementById("noFinalOnly")
  .addEventListener(
    "click",
    () => {

      setCheckedIndexes(
        finalGrid,
        [0]
      );

    }
  );


/* 기본 받침 */

document
  .getElementById("basicFinals")
  .addEventListener(
    "click",
    () => {

      setCheckedIndexes(
        finalGrid,
        basicFinalIndexes
      );

    }
  );


/* 홑받침 */

document
  .getElementById("simpleFinals")
  .addEventListener(
    "click",
    () => {

      setCheckedIndexes(
        finalGrid,
        simpleFinalIndexes
      );

    }
  );


/* 겹받침 */

document
  .getElementById("doubleFinals")
  .addEventListener(
    "click",
    () => {

      setCheckedIndexes(
        finalGrid,
        doubleFinalPracticeIndexes
      );

    }
  );


/* 전체 받침 */

document
  .getElementById("allFinals")
  .addEventListener(
    "click",
    () =>
      selectAll(finalGrid)
  );


/* 전체 해제 */

document
  .getElementById("clearFinals")
  .addEventListener(
    "click",
    () =>
      clearAll(finalGrid)
  );


/* 결과 */

modalReviewButton.addEventListener(
  "click",
  startWrongReview
);


modalNewButton.addEventListener(
  "click",
  startNewPractice
);


closeModalButton.addEventListener(
  "click",
  closeModal
);


/* 키보드 */

document.addEventListener(
  "keydown",
  event => {

    if (!gameStarted) return;


    if (
      event.key ===
      "ArrowRight"
    ) {

      handleCorrect();

    }


    if (
      event.key ===
      "ArrowLeft"
    ) {

      handleWrong();

    }

  }
);


/* =========================================================
   초기화
========================================================= */

setPracticeMode("random");

setWordLength(1);

updateScoreBoard();

updateWrongList();

</script>
